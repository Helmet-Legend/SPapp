# Tests automatiques Vulcain : à chaque modification de main et à chaque pull request.
# Un échec affiche une croix rouge sur le commit et GitHub prévient par e-mail.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests
        run: npm test

      - name: Garder le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: |
            playwright-report/
            test-results/
          retention-days: 14
